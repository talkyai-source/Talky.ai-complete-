# Drop-in for talky-api, talky-dialer-worker, talky-voice-worker and
# talky-reminder-worker. Installed to /etc/systemd/system/<unit>.d/20-talky-deps.conf.
#
# Before 2026-10-07 none of these units declared that they need Postgres and
# Redis (which run under Docker), so after a reboot they could start before
# the database existed. The workers also had StartLimitBurst=5 per 5 min with
# RestartSec=3: a database outage longer than ~15 s crash-looped them five
# times and systemd then stopped restarting them for good.
[Unit]
After=docker.service network-online.target
Wants=docker.service network-online.target
StartLimitIntervalSec=0

[Service]
ExecStartPre=/opt/talky-infra/bin/wait-for-deps
TimeoutStartSec=300
Restart=always
RestartSec=5
