# api.talkleeai.com (core-infra review 2026-10-07)
# Source of truth: backend/deploy/infra/nginx/api.talkleeai.com.conf
# Installed to:    /etc/nginx/sites-available/api.talkleeai.com (enabled by symlink)
#
# Two copies of the same API run behind this site:
#   talky_call  127.0.0.1:8000  talky-api      owns Asterisk and every live call
#   talky_web   127.0.0.1:8001  talky-api-web  dashboard, telephony switched off
#
# Live-call routes MUST reach the call process: each call's state lives in its
# memory (app/core/process_role.py). Everything else goes to the dashboard
# process, so dashboard load or a dashboard restart never stalls a call; while
# the dashboard process restarts, nginx falls back to the call process.
# The voice gateway (audio callbacks) and healthwatch talk to 127.0.0.1:8000
# directly and never pass through here; the dialer originates through here
# (API_BASE_URL is the public URL), hence the /api/v1/sip/ rule.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# First matching regex wins; anything unmatched goes to the dashboard process.
map "$request_method:$uri" $talky_upstream {
    default                                         talky_web;
    "~^[A-Z]+:/api/v1/sip/"                         talky_call;  # telephony bridge: originate, gateway audio, hangup, transfer, status
    "~^[A-Z]+:/api/v1/(twilio|vonage)/"             talky_call;  # cloud bridges keep per-process call sessions
    "~^POST:/api/v1/calls/[^/]+/hangup/?$"          talky_call;
    "~^POST:/api/v1/admin/calls/[^/]+/terminate/?$" talky_call;
    "~^POST:/api/v1/campaigns/[^/]+/(pause|stop)/?$" talky_call; # hangs up the campaign's live calls
    "~^DELETE:/api/v1/campaigns/[^/]+/?$"           talky_call;  # deleting a campaign stops it first
}

upstream talky_call {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream talky_web {
    server 127.0.0.1:8001 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8000 backup;
    keepalive 16;
}

server {
    server_name api.talkleeai.com;

    location / {
        proxy_pass http://$talky_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;   # was "upgrade" on every request
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 50m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.talkleeai.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.talkleeai.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.talkleeai.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.talkleeai.com;
    return 404; # managed by Certbot
}
