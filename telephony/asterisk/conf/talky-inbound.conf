; Managed by Talky.ai. Included from /etc/asterisk/extensions.conf via
; #include extensions.d/*.conf. Do not edit the installed copy by hand.
;
; reconcile_pjsip_configs.py inserts exact carrier-account routes at the marker
; below, but only when the reviewed carrier inventory agrees with a current
; same-tenant inbound_did_assignment joined to a verified phone number. The
; exact Request-URI route deliberately does not rely
; on endpoint set_var: several registered endpoints may share one carrier host
; and Asterisk cannot use that shared source IP to identify a unique endpoint.
; If no proven map exists, the preserved catch-all passes EXTEN through and
; admission rejects the unknown DID without answering.
[from-talky-inbound]
; TALKY_GENERATED_ACCOUNT_ROUTES
exten => _.,1,NoOp(Inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Ringing()
 same => n,Stasis(talky_ai,inbound,${EXTEN},${CONTEXT})
 same => n,Hangup()
