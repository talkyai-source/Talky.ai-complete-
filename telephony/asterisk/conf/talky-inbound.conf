; Managed by Talky.ai. Included from /etc/asterisk/extensions.conf via
; #include extensions.d/*.conf. Do not edit the installed copy by hand.
;
; Per-trunk PJSIP config sets TALKY_INBOUND_DID from validated metadata when a
; carrier sends its account/login in the Request-URI instead of the public DID.
; If no explicit map exists, EXTEN is passed through and admission rejects an
; unknown DID without answering.
[from-talky-inbound]
exten => _.,1,NoOp(Inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Ringing()
 same => n,Set(TALKY_ROUTE_DID=${IF($[${LEN(${TALKY_INBOUND_DID})} > 0]?${TALKY_INBOUND_DID}:${EXTEN})})
 same => n,Stasis(talky_ai,inbound,${TALKY_ROUTE_DID},${CONTEXT})
 same => n,Hangup()
