# Repository-safe Alertmanager routing baseline.
#
# Receiver names and severity routing are checked in so Prometheus/Alertmanager
# can be validated locally. Delivery integrations are intentionally absent:
# this repository has no approved pager destination or secret-manager mount.
# A production release MUST replace these empty receivers with a separately
# rendered, natively validated configuration whose credentials come from
# mounted secret files, then prove a real page end to end. Starting this
# baseline does not satisfy that release gate.

global:
  resolve_timeout: 5m

route:
  receiver: telephony-default
  group_by:
    - alertname
    - severity
    - team
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers:
        - team="telephony"
        - severity="critical"
      receiver: telephony-critical
      group_wait: 10s
      repeat_interval: 30m
      continue: false

    - matchers:
        - team="telephony"
        - severity="warning"
      receiver: telephony-warning
      continue: false

inhibit_rules:
  - source_matchers:
      - team="telephony"
      - severity="critical"
    target_matchers:
      - team="telephony"
      - severity="warning"
    equal:
      - alertname

receivers:
  # Empty by design. Alerts are grouped and visible in Alertmanager, but no
  # person is notified until operations installs and proves the externally
  # managed paging configuration required by the inbound release gate.
  - name: telephony-default
  - name: telephony-critical
  - name: telephony-warning
