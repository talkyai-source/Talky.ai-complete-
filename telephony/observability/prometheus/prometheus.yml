global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: talky-telephony
    phase: ws-k

rule_files:
  - /etc/prometheus/rules/telephony_ws_k_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: talky_backend_telephony
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8000
    # The token is mandatory in production and is read at scrape time from a
    # mounted secret file. Never replace this with an inline token in tracked
    # YAML.
    http_headers:
      X-Metrics-Token:
        files:
          - /etc/prometheus/secrets/talky_metrics_token
