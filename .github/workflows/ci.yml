name: CI — Lint, Test, Build, Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Match production and backend-voice-tests. The package itself requires
  # Python >=3.11, so 3.10 cannot be a meaningful compatibility gate.
  PYTHON_VERSION: "3.12"
  # 22.18+ runs TypeScript type stripping unflagged, which the Admin test
  # suite relies on (its .mjs tests import .ts sources directly).
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Secret scanning — runs first, blocks everything if secrets found
  # ──────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────
  # Guard: fail fast if placeholder secrets are still set
  # ──────────────────────────────────────────────────────────────────
  secret-guard:
    name: Secret Placeholder Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for placeholder secrets in env template
        run: |
          # Build the known-bad values at runtime. The old recursive grep put
          # each complete value literally in this workflow, so it matched its
          # own guard implementation and made every CI run fail.
          check_placeholder() {
            local needle="$1"
            local label="$2"
            local matches
            local status
            set +e
            # Workflow mirrors contain the literal examples being detected;
            # they are not runtime configuration and must not self-match.
            matches=$(git grep -n -F "${needle}" -- \
              '*.docker' '*.env*' '*.yml' '*.yaml' \
              ':(top,exclude).github/workflows/ci.yml' \
              ':(top,exclude)ci.yml' \
              ':(top,exclude)telephony/docs/**')
            status=$?
            set -e
            if [[ ${status} -eq 0 ]]; then
              printf '%s\n' "${matches}"
              echo "❌ ${label} found in committed configuration."
              exit 1
            fi
            if [[ ${status} -ne 1 ]]; then
              echo "❌ Placeholder scan itself failed (git grep exit ${status})."
              exit "${status}"
            fi
          }

          jwt_placeholder="please_change_me_in_"'production'
          db_placeholder="talkyai_"'secret'
          check_placeholder "${jwt_placeholder}" "Placeholder JWT secret"
          check_placeholder "${db_placeholder}" "Default database password"
          echo "✅ No placeholder secrets found in config files."

  # ──────────────────────────────────────────────────────────────────
  # Backend: lint + audit + test + Docker build + image scan
  # ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: [secret-scan, secret-guard]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: talky
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: talky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talky -d talky_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff pip-audit bandit fakeredis

      - name: Lint with Ruff
        # The repository still has substantial legacy style/import debt. Keep
        # the gate blocking for syntax errors, undefined names, and other
        # runtime-invalid constructs; broaden it only as that debt is retired.
        run: ruff check app/ --select F --extend-ignore F401,F841

      - name: Dependency vulnerability audit (pip-audit)
        # Fails the build on any unaccepted CVE in production deps.
        # Temporary reviewed exception (2026-07-16): patched LangSmith requires
        # websockets>=15, while both realtime provider adapters still use the
        # websockets 13 connection ABI. The application does not import or
        # expose LangSmith TracingMiddleware, the affected surface. All other
        # reported packages are upgraded or removed in requirements.in; delete
        # this exception as soon as the realtime compatibility migration lands.
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-f4xh-w4cj-qxq8

      - name: SAST scan (bandit)
        # The repository has a reviewed medium-severity legacy backlog. Keep
        # HIGH findings blocking now; ratchet medium findings into the gate as
        # that backlog is fixed instead of making every CI run unconditionally red.
        run: bandit -r app/ -lll -x app/tests

      - name: Bootstrap and migrate primary test database
        run: |
          PGPASSWORD=testpassword psql -h localhost -U talky -d postgres \
            -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE authenticated NOLOGIN NOSUPERUSER NOBYPASSRLS;"
          PGPASSWORD=testpassword psql -h localhost -U talky -d talky_test \
            -f database/complete_schema.sql -v ON_ERROR_STOP=1
          DATABASE_URL=postgresql://talky:testpassword@localhost:5432/talky_test \
            alembic stamp 0008_tenant_voice_tuning
          DATABASE_URL=postgresql://talky:testpassword@localhost:5432/talky_test \
            alembic upgrade head
        env:
          PGPASSWORD: testpassword

      - name: Preserved baseline bootstrap contract
        # Restore the historical dump with the exact PostgreSQL client family
        # that produced it, stamp only its proven revision, and exercise every
        # migration through head. This is intentionally a disposable database.
        run: |
          PGPASSWORD=testpassword psql -h localhost -U talky -d postgres \
            -c "CREATE DATABASE talky_preserved_baseline_test;"
          docker run --rm --network host \
            -e PGPASSWORD=testpassword \
            -v "$PWD:/work:ro" \
            postgres:16.14-alpine \
            psql -h 127.0.0.1 -U talky -d talky_preserved_baseline_test \
              -v ON_ERROR_STOP=1 \
              -f /work/database/schema/baseline_2026-06-02.sql
          DATABASE_URL=postgresql://talky:testpassword@localhost:5432/talky_preserved_baseline_test \
            alembic stamp 0008_tenant_voice_tuning
          DATABASE_URL=postgresql://talky:testpassword@localhost:5432/talky_preserved_baseline_test \
            alembic upgrade head
          TEST_DATABASE_URL=postgresql://talky:testpassword@localhost:5432/talky_preserved_baseline_test \
            pytest tests/integration/test_bootstrap_contract_repair.py -q
          TEST_DATABASE_URL=postgresql://talky:testpassword@localhost:5432/talky_preserved_baseline_test \
            pytest tests/integration/test_inbound_hold_resolution.py -q
        env:
          PGPASSWORD: testpassword

      - name: Legacy false-stamp repair and inbound migration round-trip
        # Reproduce the historic false 0021 marker, exercise the 0022 rollback
        # guard only within its supported boundary, then converge to head.
        # Migration 0033 is forward-only, so CI must never downgrade from head.
        run: |
          PGPASSWORD=testpassword psql -h localhost -U talky -d postgres \
            -c "CREATE DATABASE talky_alembic_test;"
          PGPASSWORD=testpassword psql -h localhost -U talky -d talky_alembic_test \
            -f database/complete_schema.sql -v ON_ERROR_STOP=1
          DATABASE_URL=postgresql://talky:testpassword@localhost:5432/talky_alembic_test \
            alembic stamp 0021_billing_topup
          DATABASE_URL=postgresql://talky:testpassword@localhost:5432/talky_alembic_test \
            alembic upgrade 0022_inbound_calling_foundation
          PGPASSWORD=testpassword psql -h localhost -U talky -d talky_alembic_test \
            -v ON_ERROR_STOP=1 -c \
            "UPDATE platform_runtime_controls SET inbound_controls_reason='downgrade guard proof' WHERE id=1;"
          if DATABASE_URL=postgresql://talky:testpassword@localhost:5432/talky_alembic_test \
              alembic downgrade 0021_billing_topup; then
            echo "0022 downgrade unexpectedly accepted retained inbound control state" >&2
            exit 1
          fi
          PGPASSWORD=testpassword psql -h localhost -U talky -d talky_alembic_test \
            -v ON_ERROR_STOP=1 -c \
            "UPDATE platform_runtime_controls SET inbound_controls_reason=NULL WHERE id=1;"
          DATABASE_URL=postgresql://talky:testpassword@localhost:5432/talky_alembic_test \
            alembic downgrade 0021_billing_topup
          PGPASSWORD=testpassword psql -h localhost -U talky -d talky_alembic_test \
            -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regprocedure('prevent_call_event_mutation()') IS NULL
               OR NOT EXISTS (
                    SELECT 1 FROM pg_trigger
                    WHERE tgname = 'call_events_immutable' AND NOT tgisinternal
               )
               OR EXISTS (
                    SELECT 1 FROM pg_class
                    WHERE oid IN ('call_events'::regclass, 'call_legs'::regclass)
                      AND (NOT relrowsecurity OR NOT relforcerowsecurity)
               )
               OR to_regclass('public.inbound_campaign_configs') IS NOT NULL THEN
              RAISE EXCEPTION '0022 downgrade did not restore the safe baseline';
            END IF;
          END
          $$;
          SQL
          DATABASE_URL=postgresql://talky:testpassword@localhost:5432/talky_alembic_test \
            alembic upgrade 0022_inbound_calling_foundation
          DATABASE_URL=postgresql://talky:testpassword@localhost:5432/talky_alembic_test \
            alembic upgrade head
        env:
          PGPASSWORD: testpassword

      - name: Migrated inbound database integration
        run: |
          pytest \
            tests/integration/test_inbound_reassignment_history.py \
            tests/integration/test_inbound_hold_resolution.py \
            tests/integration/test_bootstrap_contract_repair.py \
            -q
        env:
          TEST_DATABASE_URL: postgresql://talky:testpassword@localhost:5432/talky_alembic_test
          JWT_SECRET: ci-test-secret-key-not-for-production-32chars
          ENVIRONMENT: test

      - name: Run tests with pytest (with coverage)
        # Integration tests own the migrated database above. This is the full
        # canonical unit/security release suite, with no per-feature selection.
        # Coverage threshold starts intentionally LOW so it lands without
        # breaking the build. Ratchet it upward in follow-up PRs as test
        # coverage grows. Never lower it.
        run: |
          pytest tests/unit tests/security -v --tb=short -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=20
        env:
          DATABASE_URL: postgresql://talky:testpassword@localhost:5432/talky_test
          TEST_DATABASE_URL: postgresql://talky:testpassword@localhost:5432/talky_alembic_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-key-not-for-production-32chars
          ENVIRONMENT: test
          DEEPGRAM_API_KEY: test_key
          GROQ_API_KEY: test_key
          CARTESIA_API_KEY: test_key
          VONAGE_API_KEY: test_key
          VONAGE_API_SECRET: test_secret

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

      - name: Export OpenAPI schema
        # Boots the app just long enough to dump /openapi.json, then validates
        # it. Catches accidental schema breakage (missing fields, type drift)
        # before clients see it.
        run: |
          python -c "
          from app.main import app
          import json, sys
          schema = app.openapi()
          with open('openapi.json', 'w') as f:
              json.dump(schema, f, indent=2)
          # Sanity: must parse & contain expected top-level keys.
          assert schema.get('openapi'), 'missing openapi version'
          assert schema.get('paths'), 'no paths in schema'
          print(f'OpenAPI schema OK — {len(schema[\"paths\"])} paths')
          "
        env:
          DATABASE_URL: postgresql://talky:testpassword@localhost:5432/talky_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-key-not-for-production-32chars
          ENVIRONMENT: test
          DEEPGRAM_API_KEY: test_key
          GROQ_API_KEY: test_key
          CARTESIA_API_KEY: test_key
          VONAGE_API_KEY: test_key
          VONAGE_API_SECRET: test_secret

      - name: Upload OpenAPI schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/openapi.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────
  # Frontend: lint + typecheck + audit + build
  # ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: [secret-scan, secret-guard]
    defaults:
      run:
        working-directory: Talk-Leee

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Talk-Leee/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        # Audit the complete dependency graph. High and critical findings block
        # the release; moderate findings stay visible for follow-up.
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

  # Admin control plane: lint + dependency audit + test + production build.
  admin-frontend:
    name: Admin Frontend
    runs-on: ubuntu-latest
    needs: [secret-scan, secret-guard]
    defaults:
      run:
        working-directory: Admin/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Admin/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Telephony ingress: fail-closed routing and rollback assertions.
  telephony-static:
    name: Telephony Ingress Safety
    runs-on: ubuntu-latest
    needs: [secret-scan, secret-guard]

    steps:
      - uses: actions/checkout@v4

      - name: Validate telephony routing, admission, and rollback contracts
        run: python telephony/tests/test_telephony_stack.py

  # ──────────────────────────────────────────────────────────────────
  # Docker: build + image vulnerability scan (Trivy)
  # ──────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend, admin-frontend, telephony-static]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t talky-backend:ci ./backend

      - name: Scan image for vulnerabilities (Trivy)
        # FIX: added — scans built image for OS + package CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: talky-backend:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Build docker-compose stack
        env:
          # Compose validates required interpolation variables before it
          # selects a build target. These values are runner-local test data.
          POSTGRES_PASSWORD: ci-only-postgres-password
          REDIS_PASSWORD: ci-only-redis-password
          BACKEND_IMAGE: talky-backend:ci
        run: |
          umask 077
          printf '%s\n' \
            'POSTGRES_USER=talky' \
            'POSTGRES_DB=talky_test' \
            "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
            "REDIS_PASSWORD=${REDIS_PASSWORD}" \
            "BACKEND_IMAGE=${BACKEND_IMAGE}" > .env
          # The backend env_file is required while Compose parses the model;
          # runtime provider credentials are not needed for an image build.
          : > backend/.env
          docker compose config --quiet
          docker compose build --no-cache backend

  # ──────────────────────────────────────────────────────────────────
  # SQL Schema Validation
  # ──────────────────────────────────────────────────────────────────
  schema-check:
    name: SQL Schema Validation
    runs-on: ubuntu-latest
    needs: [secret-scan]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: talky
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: talky_schema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talky -d talky_schema_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate complete_schema.sql
        run: |
          PGPASSWORD=testpassword psql -h localhost -U talky -d talky_schema_test \
            -f backend/database/complete_schema.sql \
            -v ON_ERROR_STOP=1
        env:
          PGPASSWORD: testpassword

      - name: Verify tables created
        run: |
          PGPASSWORD=testpassword psql -h localhost -U talky -d talky_schema_test -c "
            SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;
          "
        env:
          PGPASSWORD: testpassword

      - name: Verify schema rerun and suspended-by foreign key
        run: |
          # A consolidated bootstrap schema must be safe to apply twice.
          PGPASSWORD=testpassword psql -h localhost -U talky -d talky_schema_test \
            -f backend/database/complete_schema.sql \
            -v ON_ERROR_STOP=1

          fk_counts="$(PGPASSWORD=testpassword psql -h localhost -U talky \
            -d talky_schema_test -Atc "
              SELECT count(*) || '|' || count(*) FILTER (
                WHERE c.confrelid = 'user_profiles'::regclass
                  AND c.confkey = ARRAY[
                    (SELECT attnum FROM pg_attribute
                     WHERE attrelid = 'user_profiles'::regclass
                       AND attname = 'id')
                  ]::smallint[]
              )
              FROM pg_constraint c
              WHERE c.conrelid = 'tenants'::regclass
                AND c.contype = 'f'
                AND c.conkey = ARRAY[
                  (SELECT attnum FROM pg_attribute
                   WHERE attrelid = 'tenants'::regclass
                     AND attname = 'suspended_by')
                ]::smallint[];
            ")"
          if [ "${fk_counts}" != "1|1" ]; then
            echo "Expected one exact tenants.suspended_by -> user_profiles.id foreign key; counts=${fk_counts}" >&2
            exit 1
          fi
        env:
          PGPASSWORD: testpassword
