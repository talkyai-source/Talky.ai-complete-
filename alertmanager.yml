# Repository-safe compatibility copy. The compose stack loads
# telephony/observability/alertmanager/alertmanager.yml; keep this legacy root
# file equally fail-closed so nobody mistakes placeholders for a working pager.
# Production delivery integrations must be rendered separately from mounted
# secret files and proven end to end.
global:
  resolve_timeout: 5m

route:
  receiver: telephony-default
  group_by:
    - alertname
    - severity
    - team
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers:
        - team="telephony"
        - severity="critical"
      receiver: telephony-critical
      group_wait: 10s
      repeat_interval: 30m
      continue: false

    - matchers:
        - team="telephony"
        - severity="warning"
      receiver: telephony-warning
      continue: false

inhibit_rules:
  - source_matchers:
      - team="telephony"
      - severity="critical"
    target_matchers:
      - team="telephony"
      - severity="warning"
    equal:
      - alertname

receivers:
  # Empty by design: this file cannot notify a person and is not paging proof.
  - name: telephony-default
  - name: telephony-critical
  - name: telephony-warning
